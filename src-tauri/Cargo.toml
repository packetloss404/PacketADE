[package]
name = "packetade"
version = "0.8.0"
description = "PacketADE — Agent Development Environment (IDE + multi-agent orchestration)"
authors = ["PacketADE"]
edition = "2021"
license = "Apache-2.0"
default-run = "packetade"

[lib]
name = "packetade_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
async-trait = "0.1"
glob = "0.3"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
regex = "1"
fuzzy-matcher = "0.3"
dirs = "5"
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "apple-native"] }
zeroize = "1"
cpal = "0.17"
whisper-rs = "0.16"
rustfft = "6"
rusqlite = { version = "0.33", features = ["bundled"] }
notify = "6"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.0"
enigo = "0.2"
